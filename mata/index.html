<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08121f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MATA"><title>MATA 2.2</title>
<style>
:root{--bg:#08121f;--card:#101b2a;--line:#2b3a4d;--text:#f7f9fb;--muted:#b8c2d0;--green:#79d66b;--green2:#9ae88d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%}body{overflow:auto}.app{max-width:680px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:4px;font-weight:800;color:#dce4ef}.card{background:linear-gradient(180deg,#101b2a,#0d1724);border:1px solid var(--line);border-radius:20px;margin-top:8px;padding:12px}.phase{font-size:12px;color:#a9b7c8;font-weight:800;letter-spacing:.08em}.exercise{font-size:clamp(24px,5vw,34px);font-weight:900;line-height:1.05;margin:4px 0 8px}.visual{background:#0a1421;border:1px solid #263548;border-radius:16px;overflow:hidden}.visual img{display:block;width:100%;height:auto;max-height:190px;object-fit:cover}.instructionRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}.instruction{font-size:14px;line-height:1.3;color:#dde5ef}.more{border:1px solid #3a4c61;background:#162334;color:#fff;border-radius:999px;padding:8px 10px;font-weight:800}.timer{font-size:clamp(60px,16vw,92px);font-weight:950;text-align:center;letter-spacing:-.06em;line-height:.95;margin-top:8px}.timerLabel{text-align:center;color:#b9c3d2;font-size:13px}.progress{height:7px;background:#263244;border-radius:999px;overflow:hidden;margin:8px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--green2))}.status{height:18px;text-align:center;color:#9cc9ff;font-size:12px}.primary{width:100%;border:0;border-radius:14px;padding:13px;font-size:19px;font-weight:950;background:linear-gradient(90deg,var(--green),var(--green2));color:#07111e}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}button{font-family:inherit}.secondary{border:0;border-radius:12px;padding:10px 4px;background:#1a2839;color:#fff;font-weight:850;font-size:12px}.secondary:disabled{opacity:.35}.planTitle{font-weight:900;margin-bottom:4px}.planItem{display:grid;grid-template-columns:18px 1fr auto;gap:4px;padding:5px 0;border-bottom:1px solid rgba(120,140,160,.15);font-size:13px;color:#d1dae5}.planItem.active{color:var(--green);font-weight:900}.note{font-size:11px;line-height:1.3;color:#8f9cad;margin-top:6px}.voiceMode{font-size:11px;color:#9ae88d;text-align:center;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(1,7,13,.76);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:50}.modal.open{display:flex}.sheet{width:min(650px,100%);background:#111d2c;border:1px solid #314158;border-radius:22px 22px 16px 16px;padding:18px}.sheet h2{margin:0 0 8px}.sheet p{color:#d5deea;line-height:1.4}.sheet a{color:#9ae88d}.close{width:100%;padding:12px;border:0;border-radius:14px;background:#203046;color:#fff;font-weight:900;margin-top:10px}@media(max-height:720px){.visual img{max-height:145px}.timer{font-size:52px}.exercise{font-size:22px}.planItem{padding:3px 0}}
</style></head><body>
<div class="app"><div class="top"><span id="counter">Gotowy</span><span>MATA 2.2</span><span id="clock"></span></div>
<section class="card"><div id="phase" class="phase">PORANNY RUCH</div><div id="exercise" class="exercise">7 ćwiczeń</div><div class="visual"><img id="visual" alt="Grafika ruchu"></div><div class="instructionRow"><div id="instruction" class="instruction"></div><button id="more" class="more">WIĘCEJ</button></div><div id="timer" class="timer">0:00</div><div id="timerLabel" class="timerLabel">gotowy</div><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status">Gotowe nagrania • bez Zosi</div><button id="start" class="primary">START TRENINGU</button><div class="controls"><button id="pause" class="secondary" disabled>PAUZA</button><button id="skip" class="secondary" disabled>POMIŃ</button><button id="voice" class="secondary">GŁOS</button><button id="reset" class="secondary">RESET</button></div><div class="voiceMode">Głos: nagrany, spokojny • ekran blokowany podczas treningu</div></section>
<section class="card"><div class="planTitle">Plan startowy</div><div id="plan"></div><div class="note">Przerwy: 60 s między seriami, 75 s między ćwiczeniami. Jeśli technika się pogarsza, kończ serię wcześniej.</div></section></div>
<div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><p id="modalText"></p><p id="modalTip"></p><p><a href="https://youtu.be/_kAG2ylvIdg?is=eCr5c3xOEJCw2PWU" target="_blank" rel="noopener">Otwórz film źródłowy</a></p><button id="close" class="close">ZAMKNIJ</button></div></div>
<script>
const imgs={"1":"https://raw.githack.com/makson-mcrm/wacrm/main/mata/assets/ex1.webp","2":"https://raw.githack.com/makson-mcrm/wacrm/main/mata/assets/ex2.webp","3":"https://raw.githack.com/makson-mcrm/wacrm/main/mata/assets/ex3.webp","4":"https://raw.githack.com/makson-mcrm/wacrm/main/mata/assets/ex4.webp","5":"https://raw.githack.com/makson-mcrm/wacrm/main/mata/assets/ex5.webp","6":"https://raw.githack.com/makson-mcrm/wacrm/main/mata/assets/ex6.webp","7":"https://raw.githack.com/makson-mcrm/wacrm/main/mata/assets/ex7.webp"};
const audioBase={intro:'https://www.aidocmaker.com/g0/audio?name=e171923441524e4e8f49cf2df30f9aee',ex1:'https://www.aidocmaker.com/g0/audio?name=99218d1fdb7642bb9ca73986493bfa14',ex2:'https://www.aidocmaker.com/g0/audio?name=78749859126b48588c3a1d87b4e04b49',ex3:'https://www.aidocmaker.com/g0/audio?name=0286e89d4e264968a8887e0b53d468aa',ex4:'https://www.aidocmaker.com/g0/audio?name=8f6f455e3d4542d5aed21687d73d4346',ex5:'https://www.aidocmaker.com/g0/audio?name=ac3cab6a65ee4cc99617b3a1d38f06e9',ex6:'https://www.aidocmaker.com/g0/audio?name=82d5768076a7413bba50d212e341fc3c',ex7:'https://www.aidocmaker.com/g0/audio?name=cef1fdae2a854aa3a3b6545c3659d399',s1:'https://www.aidocmaker.com/g0/audio?name=2ab7036eba11434cbaa1ff7ee1f228ef',s2:'https://www.aidocmaker.com/g0/audio?name=983af81fc2fb460db6261c38329a3d37',s3:'https://www.aidocmaker.com/g0/audio?name=d77e6b12680a429aa8d2b8397200f3e4',rest:'https://www.aidocmaker.com/g0/audio?name=015cbc73315148469fd7c48acf69fda9',ten:'https://www.aidocmaker.com/g0/audio?name=8640fb0ec9ae4fc784735d816b9f944e',end:'https://www.aidocmaker.com/g0/audio?name=e1f1d1754c46456b9365395acc47312d'};
const workout=[{name:'Wspinaczka górska',short:'Wspinaczka górska',sets:3,work:40,cue:'Pozycja deski. Naprzemiennie przyciągaj kolana do klatki, bez unoszenia bioder.',detail:'Dłonie pod barkami, ciało w jednej linii. Przyciągnij kolano do klatki, wróć i zmień nogę.',tip:'Biodra stabilnie, brzuch napięty.',img:1,a:'ex1'},{name:'Niedźwiedzi marsz',short:'Niedźwiedzi marsz',sets:3,work:30,cue:'Kolana nisko nad podłogą. Idź małymi krokami, trzymając tułów stabilnie.',detail:'Ustaw dłonie pod barkami i kolana kilka centymetrów nad podłogą. Poruszaj przeciwną ręką i nogą.',tip:'Plecy neutralne, bez kołysania biodrami.',img:2,a:'ex2'},{name:'Martwy ciąg z hantlami',short:'Martwy ciąg',sets:3,work:45,reps:10,cue:'Cofnij biodra, prowadź hantle blisko nóg i wróć do wyprostu.',detail:'Hantle po 5 kg przy udach. Ruch zaczynaj z biodra, plecy neutralnie.',tip:'Bez zaokrąglania pleców i bez szarpania.',img:3,a:'ex3'},{name:'Pompki z dotknięciem barku',short:'Pompki + bark',sets:3,work:45,reps:8,cue:'Zrób pompkę, potem dotknij przeciwnego barku. Biodra możliwie nieruchomo.',detail:'Po pompce ustabilizuj deskę i dotknij dłonią przeciwnego barku. Zmieniaj strony.',tip:'Jeśli technika siada, zwolnij.',img:4,a:'ex4'},{name:'Burpees',short:'Burpees',sets:3,work:45,reps:8,cue:'Zejdź do podporu, wróć stopami pod biodra i wyprostuj się. Płynnie, nie na wyścigi.',detail:'Dłonie na podłodze, nogi do tyłu, powrót pod tułów i wyprost.',tip:'Miękkie lądowanie, spokojny oddech.',img:5,a:'ex5'},{name:'Deska',short:'Deska',sets:3,work:40,cue:'Łokcie pod barkami. Napnij brzuch i pośladki, ciało w jednej linii.',detail:'Przedramiona na podłodze, biodra ani za wysoko, ani w dół.',tip:'Oddychaj spokojnie.',img:6,a:'ex6'},{name:'Wiosłowanie hantlami w opadzie',short:'Wiosłowanie hantlami',sets:3,work:45,reps:10,cue:'Pochyl tułów z prostymi plecami. Przyciągnij hantle do boków tułowia i spokojnie opuść.',detail:'Lekko ugnij kolana, opad z biodra. Łokcie prowadź blisko ciała i ściągaj łopatki.',tip:'Bez szarpania. To zamiennik ćwiczenia na drążku.',img:7,a:'ex7'}];
const $=id=>document.getElementById(id);let steps=[],idx=-1,running=false,paused=false,timer=null,deadline=0,total=0,remaining=0,pauseRemaining=0,wakeLock=null,current=workout[0],tenPlayed=false;
const players={};Object.entries(audioBase).forEach(([k,u])=>{const a=new Audio(u);a.preload='auto';a.volume=.68;players[k]=a});
function play(k){const a=players[k];if(!a)return;try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function playSeq(keys){let i=0;const go=()=>{if(i>=keys.length)return;const a=players[keys[i++]];if(!a)return go();a.currentTime=0;a.onended=go;a.play().catch(go)};go()}
function beep(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=650;g.gain.value=.035;o.start();o.stop(c.currentTime+.11)}catch(e){}}
async function ensureWake(){if(!running||document.visibilityState!=='visible')return;try{if('wakeLock'in navigator&&(!wakeLock||wakeLock.released)){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;if(running&&document.visibilityState==='visible')setTimeout(ensureWake,300)})}}catch(e){setTimeout(()=>{if(running)ensureWake()},1500)}}
function setEx(e){current=e;$('visual').src=imgs[e.img];$('instruction').textContent=e.cue;renderPlan()}
function renderPlan(){$('plan').innerHTML=workout.map((e,i)=>`<div class="planItem ${e===current?'active':''}"><span>${e===current?'▶':''}</span><span>${i+1}. ${e.short}</span><span>${e.sets} × ${e.reps||e.work+' s'}</span></div>`).join('')}
function build(){steps=[];workout.forEach((e,i)=>{for(let s=1;s<=e.sets;s++){steps.push({type:'work',e,set:s,sec:e.work});if(s<e.sets)steps.push({type:'rest',e,set:s,sec:60})}if(i<workout.length-1)steps.push({type:'change',e:workout[i+1],sec:75})})}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function show(st){$('counter').textContent=`Etap ${idx+1}/${steps.length}`;setEx(st.e);if(st.type==='work'){$('phase').textContent=`SERIA ${st.set} / ${st.e.sets}`;$('exercise').textContent=st.e.name;$('timerLabel').textContent=st.e.reps?`${st.e.reps} powtórzeń`:'czas pracy'}else if(st.type==='rest'){$('phase').textContent='PRZERWA';$('exercise').textContent=`Po serii ${st.set}: ${st.e.short}`;$('timerLabel').textContent='odpoczynek'}else{$('phase').textContent='ZMIANA ĆWICZENIA';$('exercise').textContent=`Następne: ${st.e.short}`;$('timerLabel').textContent='przygotowanie'}}
function announce(st){if(st.type==='work')playSeq([st.e.a,'s'+st.set]);else if(st.type==='rest')play('rest');else play(st.e.a)}
function begin(st){remaining=total=st.sec;deadline=Date.now()+st.sec*1000;tenPlayed=false;show(st);announce(st);update()}
function next(){idx++;if(idx>=steps.length)return finish();begin(steps[idx])}
function update(){if(!running||paused)return;remaining=Math.max(0,(deadline-Date.now())/1000);$('timer').textContent=fmt(remaining);$('bar').style.width=(total?100*(1-remaining/total):0)+'%';if(!tenPlayed&&remaining<=10&&remaining>0){tenPlayed=true;play('ten')}if(remaining<=0){beep();setTimeout(beep,140);next()}}
async function start(){if(running)return;build();idx=-1;running=true;paused=false;$('start').disabled=true;$('pause').disabled=false;$('skip').disabled=false;$('status').textContent='Ekran aktywny • głos z nagrań';await ensureWake();play('intro');setTimeout(next,1800);timer=setInterval(update,250)}
function finish(){running=false;clearInterval(timer);if(wakeLock&&!wakeLock.released)wakeLock.release().catch(()=>{});$('phase').textContent='KONIEC';$('exercise').textContent='Trening wykonany';$('timer').textContent='✓';$('timerLabel').textContent='koniec';$('bar').style.width='100%';$('counter').textContent='Gotowe';$('status').textContent='';$('pause').disabled=true;$('skip').disabled=true;$('start').disabled=false;play('end')}
$('start').onclick=start;$('pause').onclick=()=>{if(!running)return;if(!paused){pauseRemaining=Math.max(0,(deadline-Date.now())/1000);paused=true;$('pause').textContent='WZNÓW';$('status').textContent='Pauza'}else{paused=false;deadline=Date.now()+pauseRemaining*1000;$('pause').textContent='PAUZA';$('status').textContent='Wracamy';ensureWake()}};$('skip').onclick=()=>{if(running)next()};$('voice').onclick=()=>play('intro');$('reset').onclick=()=>location.reload();$('more').onclick=()=>{$('modalTitle').textContent=current.name;$('modalText').textContent=current.detail;$('modalTip').textContent=current.tip;$('modal').classList.add('open')};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running){ensureWake();if(!paused)update()}});window.addEventListener('focus',()=>{if(running){ensureWake();if(!paused)update()}});setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})},1000);setEx(workout[0]);renderPlan();
</script></body></html>
