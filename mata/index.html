x}.secondary:disabled{opacity:.35}.planTitle{font-weight:900;margin-bottom:4px}.planItem{display:grid;grid-template-columns:18px 1fr auto;gap:4px;padding:5px 0;border-bottom:1px solid rgba(120,140,160,.15);font-size:13px;color:#d1dae5}.planItem.active{color:#79d66b;font-weight:900}.note{font-size:11px;line-height:1.3;color:#8f9cad;margin-top:6px}.voiceMode{font-size:11px;color:#9ae88d;text-align:center;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(1,7,13,.76);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:50}.modal.open{display:flex}.sheet{width:min(650px,100%);background:#111d2c;border:1px solid #314158;border-radius:22px 22px 16px 16px;padding:18px}.sheet h2{margin:0 0 8px}.sheet p{color:#d5deea;line-height:1.4}.sheet a{color:#9ae88d}.close{width:100%;padding:12px;border:0;border-radius:14px;background:#203046;color:#fff;font-weight:900;margin-top:10px}@media(max-height:720px){.visual svg{max-height:150px}.timer{font-size:52px}.exercise{font-size:22px}.planItem{padding:3px 0}}
</style></head><body><div class="app"><div class="top"><span id="counter">Gotowy</span><span>MATA 2.2</span><span id="clock"></span></div><section class="card"><div id="phase" class="phase">PORANNY RUCH</div><div id="exercise" class="exercise">7 ćwiczeń</div><div id="visual" class="visual"></div><div class="instructionRow"><div id="instruction" class="instruction"></div><button id="more" class="more">WIĘCEJ</button></div><div id="timer" class="timer">0:00</div><div id="timerLabel" class="timerLabel">gotowy</div><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status">Głos z nagrań • bez Zosi</div><button id="start" class="primary">START TRENINGU</button><div class="controls"><button id="pause" class="secondary" disabled>PAUZA</button><button id="skip" class="secondary" disabled>POMIŃ</button><button id="voice" class="secondary">GŁOS</button><button id="reset" class="secondary">RESET</button></div><div class="voiceMode">spokojny nagrany głos • blokada wygaszania podczas treningu</div></section><section class="card"><div class="planTitle">Plan startowy</div><div id="plan"></div><div class="note">Przerwy: 60 s między seriami, 75 s między ćwiczeniami. Jeśli technika się pogarsza, kończ serię wcześniej.</div></section></div><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><p id="modalText"></p><p id="modalTip"></p><p><a href="https://youtu.be/_kAG2ylvIdg?is=eCr5c3xOEJCw2PWU" target="_blank" rel="noopener">Otwórz film źródłowy</a></p><button id="close" class="close">ZAMKNIJ</button></div></div><script>
const audioBase={intro:'https://www.aidocmaker.com/g0/audio?name=e171923441524e4e8f49cf2df30f9aee',ex1:'https://www.aidocmaker.com/g0/audio?name=99218d1fdb7642bb9ca73986493bfa14',ex2:'https://www.aidocmaker.com/g0/audio?name=78749859126b48588c3a1d87b4e04b49',ex3:'https://www.aidocmaker.com/g0/audio?name=0286e89d4e264968a8887e0b53d468aa',ex4:'https://www.aidocmaker.com/g0/audio?name=8f6f455e3d4542d5aed21687d73d4346',ex5:'https://www.aidocmaker.com/g0/audio?name=ac3cab6a65ee4cc99617b3a1d38f06e9',ex6:'https://www.aidocmaker.com/g0/audio?name=82d5768076a7413bba50d212e341fc3c',ex7:'https://www.aidocmaker.com/g0/audio?name=cef1fdae2a854aa3a3b6545c3659d399',s1:'https://www.aidocmaker.com/g0/audio?name=2ab7036eba11434cbaa1ff7ee1f228ef',s2:'https://www.aidocmaker.com/g0/audio?name=983af81fc2fb460db6261c38329a3d37',s3:'https://www.aidocmaker.com/g0/audio?name=d77e6b12680a429aa8d2b8397200f3e4',rest:'https://www.aidocmaker.com/g0/audio?name=015cbc73315148469fd7c48acf69fda9',ten:'https://www.aidocmaker.com/g0/audio?name=8640fb0ec9ae4fc784735d816b9f944e',end:'https://www.aidocmaker.com/g0/audio?name=e1f1d1754c46456b9365395acc47312d'};
const workout=[{name:'Wspinaczka górska',short:'Wspinaczka górska',sets:3,work:40,cue:'Pozycja deski. Naprzemiennie przyciągaj kolana do klatki, bez unoszenia bioder.',detail:'Dłonie pod barkami, ciało w jednej linii. Przyciągnij kolano do klatki, wróć i zmień nogę.',tip:'Biodra stabilnie, brzuch napięty.',art:'mountain',a:'ex1'},{name:'Niedźwiedzi marsz',short:'Niedźwiedzi marsz',sets:3,work:30,cue:'Kolana nisko nad podłogą. Idź małymi krokami, trzymając tułów stabilnie.',detail:'Ustaw dłonie pod barkami i kolana kilka centymetrów nad podłogą. Poruszaj przeciwną ręką i nogą.',tip:'Plecy neutralne, bez kołysania biodrami.',art:'bear',a:'ex2'},{name:'Martwy ciąg z hantlami',short:'Martwy ciąg',sets:3,work:45,reps:10,cue:'Cofnij biodra, prowadź hantle blisko nóg i wróć do wyprostu.',detail:'Hantle po 5 kg przy udach. Ruch zaczynaj z biodra, plecy neutralnie.',tip:'Bez zaokrąglania pleców i bez szarpania.',art:'deadlift',a:'ex3'},{name:'Pompki z dotknięciem barku',short:'Pompki + bark',sets:3,work:45,reps:8,cue:'Zrób pompkę, potem dotknij przeciwnego barku. Biodra możliwie nieruchomo.',detail:'Po pompce ustabilizuj deskę i dotknij dłonią przeciwnego barku. Zmieniaj strony.',tip:'Jeśli technika siada, zwolnij.',art:'push',a:'ex4'},{name:'Burpees',short:'Burpees',sets:3,work:45,reps:8,cue:'Zejdź do podporu, wróć stopami pod biodra i wyprostuj się. Płynnie, nie na wyścigi.',detail:'Dłonie na podłodze, nogi do tyłu, powrót pod tułów i wyprost.',tip:'Miękkie lądowanie, spokojny oddech.',art:'burpee',a:'ex5'},{name:'Deska',short:'Deska',sets:3,work:40,cue:'Łokcie pod barkami. Napnij brzuch i pośladki, ciało w jednej linii.',detail:'Przedramiona na podłodze, biodra ani za wysoko, ani w dół.',tip:'Oddychaj spokojnie.',art:'plank',a:'ex6'},{name:'Wiosłowanie hantlami w opadzie',short:'Wiosłowanie hantlami',sets:3,work:45,reps:10,cue:'Pochyl tułów z prostymi plecami. Przyciągnij hantle do boków tułowia i spokojnie opuść.',detail:'Lekko ugnij kolana, opad z biodra. Łokcie prowadź const $=id=>document.getElementById(id);let steps=[],idx=-1,running=false,paused=false,timer=null,deadline=0,total=0,remaining=0,pauseRemaining=0,wakeLock=null,current=workout[0],tenPlayed=false;const players={};Object.entries(audioBase).forEach(([k,u])=>{const a=new Audio(u);a.preload='auto';a.volume=.66;players[k]=a});
function person(x,y,rot=0,pose='stand'){let s=`<g transform="translate(${x} ${y}) rotate(${rot})">`;const head='<circle cx="0" cy="-36" r="11" fill="#e8edf4"/>';if(pose==='stand')s+=head+'<rect x="-12" y="-24" width="24" height="38" rx="10" fill="#cbd5e1"/><rect x="-25" y="-12" width="18" height="10" rx="5" fill="#cbd5e1"/><rect x="7" y="-12" width="18" height="10" rx="5" fill="#cbd5e1"/><rect x="-11" y="10" width="9" height="34" rx="5" fill="#cbd5e1"/><rect x="2" y="10" width="9" height="34" rx="5" fill="#cbd5e1"/>';else if(pose==='plank')s+='<ellipse cx="0" cy="0" rx="31" ry="11" fill="#cbd5e1"/><circle cx="-35" cy="-6" r="10" fill="#e8edf4"/><rect x="-23" y="8" width="10" height="33" rx="5" fill="#cbd5e1" transform="rotate(18 -18 8)"/><rect x="18" y="5" width="43" height="10" rx="5" fill="#cbd5e1" transform="rotate(10 18 5)"/><rect x="40" y="17" width="36" height="9" rx="5" fill="#cbd5e1" transform="rotate(8 40 17)"/>';else if(pose==='knee')s+='<ellipse cx="0" cy="0" rx="31" ry="11" fill="#cbd5e1"/><circle cx="-35" cy="-6" r="10" fill="#e8edf4"/><rect x="-23" y="8" width="10" height="33" rx="5" fill="#cbd5e1" transform="rotate(18 -18 8)"/><rect x="18" y="2" width="35" height="10" rx="5" fill="#cbd5e1" transform="rotate(-18 18 2)"/><rect x="13" y="8" width="30" height="10" rx="5" fill="#cbd5e1" transform="rotate(55 13 8)"/>';else if(pose==='bear')s+='<ellipse cx="0" cy="0" rx="28" ry="12" fill="#cbd5e1"/><circle cx="-34" cy="-8" r="10" fill="#e8edf4"/><rect x="-24" y="8" width="10" height="27" rx="5" fill="#cbd5e1" transform="rotate(20 -20 10)"/><rect x="16" y="8" width="10" height="27" rx="5" fill="#cbd5e1" transform="rotate(-20 20 10)"/><rect x="-4" y="10" width="10" height="28" rx="5" fill="#cbd5e1" transform="rotate(55 0 10)"/>';else if(pose==='hinge')s+='<circle cx="13" cy="-27" r="10" fill="#e8edf4"/><rect x="-10" y="-18" width="45" height="20" rx="10" fill="#cbd5e1" transform="rotate(-28)"/><rect x="-5" y="4" width="10" height="38" rx="5" fill="#cbd5e1"/><rect x="10" y="3" width="10" height="38" rx="5" fill="#cbd5e1"/><rect x="-22" y="-4" width="10" height="34" rx="5" fill="#cbd5e1"/><rect x="28" y="-4" width="10" height="34" rx="5" fill="#cbd5e1"/><rect x="-27" y="27" width="16" height="8" rx="3" fill="#53e4df"/><rect x="28" y="27" width="16" height="8" rx="3" fill="#53e4df"/>';else if(pose==='row')s+='<circle cx="13" cy="-27" r="10" fill="#e8edf4"/><rect x="-10" y="-18" width="45" height="20" rx="10" fill="#cbd5e1" transform="rotate(-28)"/><rect x="-5" y="4" width="10" height="38" rx="5" fill="#cbd5e1"/><rect x="10" y="3" width="10" height="38" rx="5" fill="#cbd5e1"/><rect x="-14" y="-8" width="28" height="10" rx="5" fill="#cbd5e1" transform="rotate(-20 -14 -8)"/><rect x="23" y="-10" width="28" height="10" rx="5" fill="#cbd5e1" transform="rotate(20 23 -10)"/><rect x="-23" y="-10" width="15" height="8" rx="3" fill="#53e4df"/><rect x="48" y="-8" width="15" height="8" rx="3" fill="#53e4df"/>';return s+'</g>'}
function visual(ex){let poses=['plank','knee','plank'];if(ex.art==='bear')poses=['bear','bear','bear'];if(ex.art==='deadlift')poses=['stand','hinge','stand'];if(ex.art==='push')poses=['plank','knee','plank'];if(ex.art==='burpee')poses=['stand','plank','stand'];if(ex.art==='plank')poses=['plank','plank','plank'];if(ex.art==='row')poses=['hinge','row','hinge'];return `<svg viewBox="0 0 420 150"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3 Z" fill="#53e4df"/></marker></defs><rect x="5" y="5" width="125" height="140" rx="16" fill="#111f2f"/><rect x="147" y="5" width="125" height="140" rx="16" fill="#111f2f"/><rect x="289" y="5" width="125" height="140" rx="16" fill="#111f2f"/>${person(66,74,0,poses[0])}${person(208,74,0,poses[1])}${person(350,74,0,poses[2])}<path d="M132 72 H145" stroke="#53e4df" stroke-width="4" marker-end="url(#arr)"/><path d="M274 72 H287" stroke="#53e4df" stroke-width="4" marker-end="url(#arr)"/><text x="67" y="137" fill="#53e4df" font-size="11" text-anchor="middle" font-weight="900">START</text><text x="209" y="137" fill="#53e4df" font-size="11" text-anchor="middle" font-weight="900">RUCH</text><text x="351" y="137" fill="#53e4df" font-size="11" text-anchor="middle" font-weight="900">KONIEC</text></svg>`}
function play(k){const a=players[k];if(!a)return;try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}function playSeq(keys){let i=0;const go=()=>{if(i>=keys.length)return;const a=players[keys[i++]];if(!a)return go();a.currentTime=0;a.onended=go;a.play().catch(go)};go()}function beep(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=650;g.gain.value=.035;o.start();o.stop(c.currentTime+.11)}catch(e){}}async function ensureWake(){if(!running||document.visibilityState!=='visible')return;try{if('wakeLock'in navigator&&(!wakeLock||wakeLock.released)){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;if(running&&document.visibilityState==='visible')setTimeout(ensureWake,300)})}}catch(e){setTimeout(()=>{if(running)ensureWake()},1500)}}function setEx(e){current=e;$('visual').innerHTML=visual(e);$('instruction').textContent=e.cue;renderPlan()}function renderPlan(){$('plan').innerHTML=workout.map((e,i)=>`<div class="planItem ${e===current?'active':''}"><span>${e===current?'▶':''}</span><span>${i+1}. ${e.short}</span><span>${e.sets} × ${e.reps||e.work+' s'}</span></div>`).join('')}function build(){steps=[];workout.forEach((e,i)=>{for(let s=1;s<=e.sets;s++){steps.push({type:'work',e,set:s,sec:e.work});if(s<e.sets)steps.push({type:'rest',e,set:s,sec:60})}if(i<workout.length-1)steps.push({type:'change',e:workout[i+1],sec:75})})}function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function show(st){$('counter').textContent=`Etap ${idx+1}/${steps.length}`;setEx(st.e);if(st.type==='work'){$('phase').textContent=`SERIA ${st.set} / ${st.e.sets}`;$('exercise').textContent=st.e.name;$('timerLabel').textContent=st.e.reps?`${st.e.reps} powtórzeń`:'czas pracy'}else if(st.type==='rest'){$('phase').textContent='PRZERWA';$('exercise').textContent=`Po serii ${st.set}: ${st.e.short}`;$('timerLabel').textContent='odpoczynek'}else{$('phase').textContent='ZMIANA ĆWICZENIA';$('exercise').textContent=`Następne: ${st.e.short}`;$('timerLabel').textContent='przygotowanie'}}function announce(st){if(st.type==='work')playSeq([st.e.a,'s'+st.set]);else if(st.type==='rest')play('rest');else play(st.e.a)}function begin(st){remaining=total=st.sec;deadline=Date.now()+st.sec*1000;tenPlayed=false;show(st);announce(st);update()}function next(){idx++;if(idx>=steps.length)return finish();begin(steps[idx])}function update(){if(!running||paused)return;remaining=Math.max(0,(deadline-Date.now())/1000);$('timer').textContent=fmt(remaining);$('bar').style.width=(total?100*(1-remaining/total):0)+'%';if(!tenPlayed&&remaining<=10&&remaining>0){tenPlayed=true;play('ten')}if(remaining<=0){beep();setTimeout(beep,140);next()}}async function start(){if(running)return;build();idx=-1;running=true;paused=false;$('start').disabled=true;$('pause').disabled=false;$('skip').disabled=false;$('status').textContent='Ekran aktywny • głos z nagrań';await ensureWake();play('intro');setTimeout(next,1800);timer=setInterval(update,250)}function finish(){running=false;clearInterval(timer);if(wakeLock&&!wakeLock.released)wakeLock.release().catch(()=>{});$('phase').textContent='KONIEC';$('exercise').textContent='Trening wykonany';$('timer').textContent='✓';$('timerLabel').textContent='koniec';$('bar').style.width='100%';$('counter').textContent='Gotowe';$('status').textContent='';$('pause').disabled=true;$('skip').disabled=true;$('start').disabled=false;play('end')}
$('start').onclick=start;$('pause').onclick=()=>{if(!running)return;if(!paused){pauseRemaining=Math.max(0,(deadline-Date.now())/1000);paused=true;$('pause').textContent='WZNÓW';$('status').textContent='Pauza'}else{paused=false;deadline=Date.now()+pauseRemaining*1000;$('pause').textContent='PAUZA';$('status').textContent='Wracamy';ensureWake()}};$('skip').onclick=()=>{if(running)next()};$('voice').onclick=()=>play('intro');$('reset').onclick=()=>location.reload();$('more').onclick=()=>{$('modalTitle').textContent=current.name;$('modalText').textContent=current.detail;$('modalTip').textContent=current.tip;$('modal').classList.add('open')};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running){ensureWake();if(!paused)update()}});window.addEventListener('focus',()=>{if(running){ensureWake();if(!paused)update()}});setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})},1000);setEx(workout[0]);renderPlan();
</script></body></html>
