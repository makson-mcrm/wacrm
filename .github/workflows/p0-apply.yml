name: Apply tested P0 handoff

on:
  push:
    branches: [codex/p3-core-roundtrip]
    paths: [.github/workflows/p0-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p3-core-roundtrip
          fetch-depth: 0
      - name: Apply exact tested P0 changes
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f'anchor missing: {path}')
              p.write_text(s.replace(old,new,1))

          p='src/components/sales/quick-activity-form.tsx'
          rep(p, '  buildContactActivityUpdate,\n  formatFollowUpAction,', '  buildContactActivityUpdate,\n  buildDealActivityUpdate,\n  formatFollowUpAction,')
          rep(p, "        const updates: Record<string, string | null> = {};\n        if (storedNextAction) updates.next_action = storedNextAction;\n        if (scheduledIso) updates.next_action_at = scheduledIso;\n        if (!selectedDeal?.product_type && dealProductDraft.trim())\n          updates.product_type = dealProductDraft.trim();\n        if (!selectedDeal?.source && dealSourceDraft.trim())\n          updates.source = dealSourceDraft.trim();\n        updates.blocker = blocker.trim() || null;\n        updates.blocker_since = blocker.trim()\n          ? selectedDeal?.blocker_since || nowIso\n          : null;", "        const updates = buildDealActivityUpdate({\n          nextAction: storedNextAction,\n          nextActionAt: scheduledIso,\n          blocker: blocker.trim(),\n          blockerSince: selectedDeal?.blocker_since || nowIso,\n        });\n        if (!selectedDeal?.product_type && dealProductDraft.trim())\n          updates.product_type = dealProductDraft.trim();\n        if (!selectedDeal?.source && dealSourceDraft.trim())\n          updates.source = dealSourceDraft.trim();")

          p='src/lib/sales/quick-activity.ts'
          rep(p, "  if (nextActionAt) update.follow_up_at = nextActionAt;\n  return update;\n}\nexport const activityTypeForDb", "  if (nextActionAt) update.follow_up_at = nextActionAt;\n  return update;\n}\nexport function buildDealActivityUpdate({\n  nextAction,\n  nextActionAt,\n  blocker,\n  blockerSince,\n}: {\n  nextAction: string;\n  nextActionAt: string | null;\n  blocker: string;\n  blockerSince: string | null;\n}) {\n  const update: Record<string, string | null> = {};\n  if (nextAction) {\n    update.next_action = nextAction;\n    update.next_action_at = nextActionAt;\n  } else if (nextActionAt) {\n    update.next_action_at = nextActionAt;\n  }\n  update.blocker = blocker || null;\n  update.blocker_since = blocker ? blockerSince : null;\n  return update;\n}\nexport const activityTypeForDb")

          p='src/lib/sales/quick-activity.test.ts'
          rep(p, '  buildContactActivityUpdate,\n  followUpPreset,', '  buildContactActivityUpdate,\n  buildDealActivityUpdate,\n  followUpPreset,')
          anchor="  it('reports whether one Deal can be selected automatically', () => {"
          tests="""  it('stores one coherent next action, deadline and blocker update', () => {\n    expect(\n      buildDealActivityUpdate({\n        nextAction: 'Dosłać dokumenty',\n        nextActionAt: '2026-09-08T10:00:00Z',\n        blocker: 'Brak zaświadczenia',\n        blockerSince: '2026-09-08T08:00:00Z',\n      })\n    ).toEqual({\n      next_action: 'Dosłać dokumenty',\n      next_action_at: '2026-09-08T10:00:00Z',\n      blocker: 'Brak zaświadczenia',\n      blocker_since: '2026-09-08T08:00:00Z',\n    });\n  });\n  it('clears an old deadline for a new undated action without erasing unrelated action data', () => {\n    expect(\n      buildDealActivityUpdate({\n        nextAction: 'Czekać na odpowiedź',\n        nextActionAt: null,\n        blocker: '',\n        blockerSince: null,\n      })\n    ).toMatchObject({ next_action_at: null });\n    expect(\n      buildDealActivityUpdate({\n        nextAction: '',\n        nextActionAt: null,\n        blocker: '',\n        blockerSince: null,\n      })\n    ).not.toHaveProperty('next_action');\n  });\n"""
          rep(p, anchor, tests+anchor)

          p='src/lib/today/existing-data.ts'
          rep(p, '        dueAt: existing.dueAt ?? row.snoozed_until,', "        dueAt:\n          existing.source === 'deal'\n            ? existing.dueAt\n            : (existing.dueAt ?? row.snoozed_until),")
          rep(p, "        dueAt: dealIsSourceOfTruth\n          ? existing.dueAt ?? dueAt\n          : dueAt ?? existing.dueAt,\n        signal: existing.signal ?? activitySignal(row),", "        dueAt: dealIsSourceOfTruth ? existing.dueAt : (dueAt ?? existing.dueAt),\n        signal: dealIsSourceOfTruth\n          ? existing.signal\n          : (existing.signal ?? activitySignal(row)),")
          rep(p, '        action: row.title,\n        manualPriority:', "        action: existing.source === 'deal' ? existing.action : row.title,\n        manualPriority:")

          p='src/lib/today/ranking.ts'
          rep(p, "    if (nextBlock && due <= new Date(nextBlock.startsAt))\n      return 'NASTEPNY_BLOK';\n  }\n  if (contextFits", "    if (nextBlock && due <= new Date(nextBlock.startsAt))\n      return 'NASTEPNY_BLOK';\n    return 'POZNIEJ_DZISIAJ';\n  }\n  if (contextFits")

          p='src/lib/today/existing-data.test.ts'
          rep(p, "      action: 'Doprowadź decyzję do końca',\n      dueAt: '2026-09-08T09:00:00Z',", "      action: 'Telefon do banku',\n      dueAt: undefined,")
          anchor="  it('uses existing queue sources for future-revenue signals', () => {"
          test="""  it('does not restore a cleared Deal deadline from stale related records', () => {\n    const result = buildTodayInputs({\n      now,\n      deals: [{ id: 'd1', title: 'Hipoteka', next_action_at: null }],\n      queue: [\n        {\n          id: 'q1',\n          source_type: 'ALERT_CRM',\n          status: 'NOWE',\n          deal_id: 'd1',\n          snoozed_until: '2026-09-09T09:00:00Z',\n        },\n      ],\n      activities: [\n        {\n          id: 'a1',\n          title: 'Stary termin',\n          deal_id: 'd1',\n          scheduled_at: '2026-09-07T09:00:00Z',\n        },\n      ],\n    });\n\n    expect(result.candidates).toHaveLength(1);\n    expect(result.candidates[0].dueAt).toBeNull();\n  });\n\n"""
          rep(p, anchor, test+anchor)

          p='src/lib/today/ranking.test.ts'
          anchor="  it('infers context from action labels', () => {"
          # Insert before final describe close instead, robustly.
          s=Path(p).read_text(); pos=s.rfind('\n});')
          test="""\n\n  it('keeps tomorrow and later actions out of TERAZ despite matching context', () => {\n    const plan = buildTodayPlan({\n      now,\n      currentContext: 'DOM_KOMPUTER',\n      candidates: [\n        candidate({ id: 'overdue', dueAt: '2026-09-08T07:00:00Z' }),\n        candidate({ id: 'today', dueAt: '2026-09-08T09:00:00Z' }),\n        candidate({\n          id: 'tomorrow',\n          dueAt: '2026-09-09T09:00:00Z',\n          context: 'DOM_KOMPUTER',\n        }),\n      ],\n    });\n    expect(plan.now[0].id).toBe('overdue');\n    expect(plan.laterToday.some((item) => item.id === 'today')).toBe(true);\n    expect(plan.laterToday.some((item) => item.id === 'tomorrow')).toBe(true);\n  });"""
          if pos<0: raise SystemExit('ranking test close missing')
          Path(p).write_text(s[:pos]+test+s[pos:])

          Path('src/lib/today/activity-roundtrip.test.ts').write_text("""import { describe, expect, it } from 'vitest';\nimport { buildDealActivityUpdate } from '@/lib/sales/quick-activity';\nimport { buildTodayInputs } from './existing-data';\nimport { buildTodayPlan } from './ranking';\n\ndescribe('activity to Deal to DZISIAJ round-trip', () => {\n  it('shows the selected Deal values once and links back to that exact Deal', () => {\n    const now = new Date('2026-09-08T08:00:00Z');\n    const update = buildDealActivityUpdate({\n      nextAction: 'Dosłać dokument do banku',\n      nextActionAt: '2026-09-08T07:00:00Z',\n      blocker: 'Brak zaświadczenia',\n      blockerSince: now.toISOString(),\n    });\n    const inputs = buildTodayInputs({\n      now,\n      deals: [{ id: 'deal-a', title: 'Hipoteka A', contact_id: 'contact-a', company_id: 'company-a', ...update }],\n      activities: [{ id: 'old-activity', title: 'Stary follow-up', deal_id: 'deal-a', scheduled_at: '2026-09-07T09:00:00Z' }],\n      queue: [{ id: 'queue-a', source_type: 'ALERT_CRM', status: 'NOWE', deal_id: 'deal-a', snoozed_until: '2026-09-09T09:00:00Z' }],\n      priorities: [{ id: 'priority-a', position: 1, title: 'Stary zapisany priorytet', completed: false, deal_id: 'deal-a' }],\n    });\n    expect(inputs.candidates).toHaveLength(1);\n    expect(inputs.candidates[0]).toMatchObject({ id: 'deal:deal-a', action: 'Dosłać dokument do banku', dueAt: '2026-09-08T07:00:00Z', blocker: 'Brak zaświadczenia', href: '/quick-call?deal=deal-a&contact=contact-a&company=company-a' });\n    expect(buildTodayPlan({ now, candidates: inputs.candidates }).now[0]).toMatchObject({ id: 'deal:deal-a', section: 'TERAZ' });\n  });\n});\n""")
      - name: Commit exact P0 and remove transport workflow
        run: |
          rm .github/workflows/p0-apply.yml
          git config user.name "mCRM P0 automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/sales/quick-activity-form.tsx src/lib/sales/quick-activity.ts src/lib/sales/quick-activity.test.ts src/lib/today/existing-data.ts src/lib/today/existing-data.test.ts src/lib/today/ranking.ts src/lib/today/ranking.test.ts src/lib/today/activity-roundtrip.test.ts .github/workflows/p0-apply.yml
          git commit -m "fix(today): preserve deal activity roundtrip"
          git push origin HEAD:codex/p3-core-roundtrip
